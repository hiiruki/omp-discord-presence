# Dependency updates, checked weekly. Every PR runs CI (typecheck, lint, tests); merge when it's green.
# Majors stay ungrouped, one PR per package, so a breaking update can't hold back the rest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm # pnpm-lock.yaml is updated too
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # omp's packages are released together and must move in lockstep.
      omp:
        patterns: ["@oh-my-pi/*"]
      # Types, linter and compiler: patch and minor updates land together.
      dev-tooling:
        dependency-type: development
        exclude-patterns: ["@oh-my-pi/*"]
        update-types: [minor, patch]
